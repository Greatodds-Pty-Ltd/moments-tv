<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Moments that Matter: office TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;800;900&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tv/tv.css">
</head>
<body>
<div id="fit"><div id="stage">
  <header class="bar">
    <div class="brand"><img class="logo" alt="Sportingbet" src="/brand/logo-white.png"><div class="kicker"><b>Moments that Matter</b>&nbsp;&nbsp;Campaign calendar, next 12 weeks</div></div>
    <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dte"></div></div>
  </header>
  <div class="stale" id="stale"></div>

  <section class="scene" id="sc1"><div class="s1">
    <div class="hero" id="hero"></div>
    <div class="wk"><h1 id="wkTitle">This week</h1><div class="sub" id="wkSub"></div><div class="rows" id="wkRows"></div><div class="more" id="wkMore"></div></div>
  </div></section>

  <section class="scene" id="sc2"><h1>The next 12 weeks</h1><div class="grid12" id="grid"></div></section>

  <section class="scene" id="sc3"><h1>Priority A campaigns</h1><div class="camps" id="camps"></div></section>

  <footer class="foot">
    <div class="note" id="note">Loading the Moments Campaign Calendar…</div>
    <div class="dots" id="dots"><span><b></b></span><span><b></b></span><span><b></b></span></div>
  </footer>
</div></div>
<script src="/tv/tv.js"></script>
</body>
</html>
